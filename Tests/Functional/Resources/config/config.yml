framework:
  test: true
  router:
    resource:
  http_method_override: true

plum_tree_systems_file:
  path_map:
    'bucket1/files':
      provider: s3_files_1
    'local/location':
      provider: local_1
  default_provider: 's3_files_1'
  generic_providers:
    local:
      local_1:
        dir: '%kernel.project_dir%/var/files'
        dir_url: 'https://test.com/files'
    s3:
      s3_files_1:
        bucket: test_bucket1
        region: eu_west_2
        key: key
        secret: secret
      
      s3_files_2:
        bucket: test_bucket2
        region: eu_west_2
        key: key
        secret: secret
  file_class: 'App\Document\File'

when@prod:
    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
